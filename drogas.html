<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prevenção contra as drogas</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
        }

        header{
            background:#1e293b;
            padding:20px;
            text-align:center;
        }

        nav{
            background:#334155;
            padding:15px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        .hero{
            padding:80px 20px;
            text-align:center;
        }

        .hero h1{
            font-size:3rem;
            margin-bottom:15px;
        }

        .hero p{
            font-size:1.2rem;
            margin-bottom:20px;
        }

        .btn{
            display:inline-block;
            background:#3b82f6;
            color:white;
            padding:12px 25px;
            text-decoration:none;
            border-radius:8px;
        }

        .container{
            max-width:1200px;
            margin:auto;
            padding:40px 20px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
            gap:20px;
        }

        .card{
            background:#1e293b;
            padding:20px;
            border-radius:10px;
            text-align:center;
        }

        footer{
            background:#1e293b;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu Site</h1>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Galeria</a>
        <a href="#">Contato</a>
    </nav>

    <section class="hero">
        <h1>Bem-vindo ao Meu Site</h1>
        <p>Crie projetos incríveis com HTML e CSS.</p>
        <a href="#" class="btn">Saiba Mais</a>
    </section>

    <main class="container">
        <h2>Conteúdo Principal</h2>
        <br>

        <div class="cards">
            <div class="card">
                <h3>Card 1</h3>
                <p>Descrição do conteúdo.</p>
            </div>

            <div class="card">
                <h3>Card 2</h3>
                <p>Descrição do conteúdo.</p>
            </div>

            <div class="card">
                <h3>Card 3</h3>
                <p>Descrição do conteúdo.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Meu Site - Todos os direitos reservados menor ratin.</p>
    </footer>

</body>
</html>
